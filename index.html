cuivre"],tags:["support"]}),ui({id:"i-cartouches",nom:"Cartouches de Matière",type:"reserve",croquis:8,description:"Petites réserves de matières dont Shinji connaît précisément la composition.",passif:"Une matière connue, toujours sous la main : l’échange équivalent a de quoi payer.",actif:"—",limites:"Petites quantités.",statut:"plan",classification:"theorique",materiaux:["m-sable-suna","m-cuivre"],tags:["réserve"]})],Xa=e=>({...ro(),...e,...Za(),fixe:!0}),B5=[Xa({id:"t-kosei",titre:"Kōseijutsu — Art de la Composition",domaine:"kosei",classification:"connu",tags:["principe"],texte:`Discipline scientifique shinobi permettant de comprendre puis modifier une matière grâce au chakra et à une matrice.

Le cycle fondamental actuel est :

LECTURE → DÉCOMPOSITION → RECOMPOSITION

Lecture — comprendre : composition, structure, proportions, propriétés, défauts.

Décomposition — dissocier temporairement la structure de la matière en ses composants utilisables.

Recomposition — réorganiser ces composants selon la matrice choisie.

Une stabilisation peut ensuite être nécessaire selon la matière.

Règle centrale : « On ne peut recomposer correctement que ce que l’on comprend. »`}),Xa({id:"t-echange",titre:"Échange équivalent",domaine:"kosei",classification:"connu",tags:["principe"],texte:`La matière n’est pas créée gratuitement. Une transformation utilise une matière existante.

Le résultat dépend :
— de la quantité disponible ;
— de sa composition ;
— de sa structure ;
— de l’énergie fournie ;
— de la précision de la matrice.

Shinji ne peut pas transformer arbitrairement une matière en quelque chose dont les composants nécessaires sont absents.`}),Xa({id:"t-stabilisation",titre:"Stabilisation",domaine:"sigilla",classification:"experimental",tags:["matrice"],texte:`Après la recomposition, certaines matières « veulent » revenir à leur état d’avant. Une stabilisation — un dernier anneau de la matrice, maintenu quelques secondes de plus — fixe la nouvelle organisation.

Observé sur le sable (Compression I) : sans stabilisation, la zone durcie se relâche en quelques heures. À confirmer sur d’autres matières.`}),Xa({id:"t-resonance",titre:"Retour de Résonance",domaine:"sigilla",classification:"connu",tags:["danger"],texte:`Quand une recomposition ne peut pas se stabiliser, l’énergie engagée dans la matrice revient vers son point d’injection — le corps de celui qui trace.

Un petit Retour fatigue. Un grand Retour détruit. J’en ai mesuré un, une seule fois, sans instrument : il m’a coûté le bras gauche.

Depuis : anneaux de dissipation, fusibles sacrificiels, et aucune matrice dont la recomposition n’est pas comprise d’avance.`}),Xa({id:"t-structure",titre:"Même composition ne signifie pas même matière",domaine:"materia",classification:"connu",tags:["matériaux"],texte:`Graphite et diamant sont tous deux constitués de carbone. Glace et eau sont la même H₂O. La composition dit DE QUOI une matière est faite ; la structure dit COMMENT. Une matrice doit connaître les deux.

Corollaire : ne pas traiter « cristal » comme une composition. La structure cristalline doit être identifiée précisément.`}),Xa({id:"t-vivant",titre:"Le vivant n’est pas une liste d’éléments",domaine:"vita",classification:"interdit",tags:["vivant","tabou"],texte:`Connaître les éléments chimiques d’un humain (≈ 65 % O, 18 % C, 10 % H, 3 % N, 1,5 % Ca, 1 % P…) ne signifie absolument pas comprendre un organisme vivant, son réseau de chakra, son cerveau, sa conscience ou son âme.

Une grande partie du vivant est considérée comme interdite ou extrêmement dangereuse. L’étude s’arrête à l’observation.`}),Xa({id:"t-noese",titre:"TABOU — Matrice de Noèse",domaine:"anomalia",classification:"interdit",tags:["tabou","accident"],texte:`J’ai tenté d’appliquer les principes du Kōseijutsu à ma propre conscience.

Objectif : atteindre une forme de connaissance ultime de l’alchimie en réorganisant souvenirs, associations mentales, compréhension, mémoire, conscience. Je pensais pouvoir améliorer artificiellement ma manière d’apprendre et connecter toutes mes connaissances.

La matrice a commencé à lire ma conscience ; puis à décomposer mon organisation mentale. Pendant quelques secondes, j’ai perçu énormément de connexions entre mes connaissances. Puis la conscience a commencé à se modifier pendant même que la matrice tentait de la recomposer. La Recomposition est devenue impossible à stabiliser. Un immense Retour de Résonance s’est produit. Mon bras, principal point d’injection de chakra, a été détruit. Il a dû être amputé.

« J’ai voulu transformer mon esprit en bibliothèque. J’ai oublié qu’une bibliothèque ne souffre pas lorsque l’on déplace ses livres. »

Prix : bras gauche.`}),Xa({id:"t-consequences",titre:"Conséquences mentales",domaine:"anomalia",classification:"connu",tags:["personnel"],texte:`L’accident n’a pas seulement coûté un bras. Certains souvenirs et connexions émotionnelles semblent avoir été altérés.

Ancien Shinji : curieux, spontané, paresseux, amusé par ses expériences, relativement insouciant.

Nouveau Shinji : froid, silencieux, méthodique, obsessionnel, perfectionniste, beaucoup plus distant, extrêmement contrôlé, presque incapable de supporter une hypothèse non vérifiée.

« “Devrait” est le mot qui m’a coûté un bras. »

La curiosité reste présente. Mais elle n’est plus joyeuse. Elle devient presque une faim.`}),Xa({id:"t-pierre",titre:"Pierre Philosophale",domaine:"anomalia",classification:"interdit",tags:["anomalia","tabou"],texte:`Elle est créée en condensant de nombreuses vies / âmes humaines dans un support. Elle constitue une réserve énergétique immense.

Elle ne supprime pas réellement l’échange équivalent : le prix a simplement déjà été payé.

Règle fondamentale : la Pierre fournit de l’énergie. Elle ne fournit pas la connaissance. Il faut toujours comprendre la matière que l’on souhaite recomposer.

Chaque utilisation importante consomme progressivement l’énergie — et donc les âmes — contenues dans la Pierre.

La création d’une Pierre est un tabou absolu. Son étude peut exister ici, dans ANOMALIA, et nulle part ailleurs.`}),Xa({id:"t-homoncule",titre:"Homoncules — projet théorique",domaine:"vita",classification:"futur",tags:["futur","vivant"],texte:`Objectif théorique ultime : créer une forme de vie artificielle sans sacrifier de vie existante.

Étapes hypothétiques : matière organique → organisme simple → réseau de chakra → comportement → conscience.

Premier objectif théorique possible : Khepri, petit scarabée artificiel expérimental. Pas encore maîtrisé.

Ne pas considérer ce projet comme une capacité actuelle.`})],qr=e=>({...lo(),...e,...Za(),fixe:!0}),$5=[qr({id:"q-bras",titre:"Kōsei no Ude — Bras de Composition",type:"bras",classification:"experimental",statut:"en-cours",texte:"Faire évoluer la prothèse, version après version, au rythme des recherches.",etapes:[{id:"q-bras-0",texte:"V0 — prothèse simple",fait:!0},{id:"q-bras-1",texte:"V1 — conduction du chakra",fait:!1},{id:"q-bras-2",texte:"V2 — Lecture",fait:!1},{id:"q-bras-3",texte:"V3 — outils",fait:!1},{id:"q-bras-4",texte:"V4 — sable d’or",fait:!1},{id:"q-bras-5",texte:"V5 — dissipation",fait:!1},{id:"q-bras-6",texte:"V6 — matrices modulaires",fait:!1},{id:"q-bras-7",texte:"V7 — Bras de Composition avancé",fait:!1}]}),qr({id:"q-sable-stabilise",titre:"Couche intermédiaire de sable stabilisé",type:"recherche",classification:"experimental",statut:"idee",texte:"Nouvelle piste née de Liaison I : interposer du sable stabilisé entre deux fragments pour obtenir une couture homogène.",etapes:[{id:"q-ss-1",texte:"Stabiliser une fine couche de sable (Compression I + stabilisation)",fait:!1},{id:"q-ss-2",texte:"Refaire Liaison I avec la couche",fait:!1},{id:"q-ss-3",texte:"Tester en torsion",fait:!1}],liens:["r:r-04"]}),qr({id:"q-brise-faille",titre:"Brise‑Faille",type:"invention",classification:"theorique",statut:"idee",texte:"Marteau de Rupture : la masse d’abord, la matrice ensuite. À présenter aux MJ dans un nouveau dossier.",etapes:[{id:"q-bf-1",texte:"Forger la tête (acier)",fait:!1},{id:"q-bf-2",texte:"Comprendre la Matrice de Rupture (théorie)",fait:!1},{id:"q-bf-3",texte:"Dossier MJ",fait:!1}],liens:["i:i-brise-faille","x:x-rupture"]}),qr({id:"q-territoriale",titre:"Grande Matrice Territoriale",type:"matrice",classification:"theorique",statut:"idee",texte:"Un réseau de matrices reliées par des relais, agissant à l’échelle d’un territoire. Théorique, restreint.",etapes:[{id:"q-gt-1",texte:"Relais d’Or fonctionnels",fait:!1},{id:"q-gt-2",texte:"Deux matrices reliées à distance",fait:!1},{id:"q-gt-3",texte:"Mesurer un Retour de Résonance à distance",fait:!1}],liens:["x:x-territoriale","i:i-relais-or"],seuil:60}),qr({id:"q-khepri",titre:"Khepri — scarabée artificiel",type:"theorie",classification:"futur",statut:"idee",texte:"Premier objectif théorique possible des homoncules : un petit scarabée artificiel expérimental. Pas encore maîtrisé. Ne pas considérer comme une capacité actuelle.",etapes:[{id:"q-kh-1",texte:"Matière organique",fait:!1},{id:"q-kh-2",texte:"Organisme simple",fait:!1},{id:"q-kh-3",texte:"Réseau de chakra",fait:!1},{id:"q-kh-4",texte:"Comportement",fait:!1},{id:"q-kh-5",texte:"Conscience",fait:!1}],liens:["t:t-homoncule"],seuil:80})],U5=[{...Za(),id:"c-shinji",nom:"Shinji Sabaku",role:"Moi",relation:"moi‑même",notes:"Clan Sabaku, Sunagakure. Kōseijutsu, géologie, forge, Fûinjutsu. Bras gauche : Kōsei no Ude.",self:!0}],di=e=>({...io(e.categorie,e.epoque),facettes:Qa(),...e,...Za()}),H5=[di({id:"e-01",titre:"Pourquoi le sable",categorie:"geologie",epoque:"avant",humeur:"curieux",lieu:"Dunes, au sud du village",tags:["sable","début"],texte:`Tout le monde ici marche sur du sable sans le regarder. Moi je l’ai regardé. De près. Avec la loupe de l’atelier.

Ce n’est pas « du sable ». C’est des milliards de petits cailloux, presque tous du quartz, qui ne tiennent à rien. Ils coulent entre les doigts parce que rien ne les lie. Le grès, c’est la même chose, mais quelqu’un (le temps) a mis de la colle.

Question du jour : si la colle est la seule différence, est‑ce que je peux la mettre moi‑même ?`,facettes:{...Qa(),reflexion:"Je crois que je viens de choisir mon sujet pour les dix prochaines années. Ou pour la semaine. On verra."},marge:[{id:"e-01-n1",text:"acheter une meilleure loupe",x:62,y:18,rot:-4,ink:"crayon"}]}),di({id:"e-02",titre:"Kōseijutsu — la règle du jeu",categorie:"kosei",epoque:"avant",humeur:"excite",tags:["principe","kōseijutsu"],texte:`Je lui ai trouvé un nom : Kōseijutsu, l’Art de la Composition. Comprendre une matière, puis la modifier avec du chakra et une matrice.

Trois temps. LECTURE (qu’est‑ce que c’est, vraiment). DÉCOMPOSITION (défaire, un moment, pour avoir les composants sous la main). RECOMPOSITION (remettre, mais dans l’ordre que la matrice décide).

Et une règle que je me répète : on ne peut recomposer correctement que ce que l’on comprend. Donc d’abord comprendre. Donc étudier. Donc, oui, travailler. (Je sais.)`,liens:["t:t-kosei"],facettes:{...Qa(),ambition:"Un jour, un mur entier. Pour l’instant : un tas de sable."}}),di({id:"e-03",titre:"Compression I — ça marche (un peu)",categorie:"experience",epoque:"avant",humeur:"fier",lieu:"Carrière Est de Suna",tags:["compression","sable","grès"],texte:`Quatre minutes pour tracer la matrice. Quatre. Mon genou a un souvenir du gravier.

Résultat modeste. Mais refait trois fois, et trois fois pareil. Je préfère un petit résultat qui se répète à un grand qui n’existe qu’une fois.`,liens:["r:r-03"],facettes:{...Qa(),decouverte:"Le sable répond mieux que le grès. L’effet reste sur une petite zone."},marge:[{id:"e-03-n1",text:"flux instable ×2 — respirer AVANT",x:4,y:60,rot:3,ink:"rouge"}]}),di({id:"e-04",titre:"Liaison I, et la couture",categorie:"experience",epoque:"avant",humeur:"frustre",lieu:"Laboratoire des Dunes",tags:["liaison","grès"],texte:`Deux morceaux de grès, un seul à la fin. Victoire ? Presque. On voit la couture. Ça tient quand on appuie, ça casse quand on tord.

Je pense que la couture n’a pas la structure du grès : elle a la structure de « deux surfaces sales qu’on a forcées ». Nouvelle piste : une couche de sable stabilisé entre les deux, pour que la jonction ait quelque chose d’homogène à recomposer.`,liens:["r:r-04"],facettes:{...Qa(),decouverte:"Résistance correcte en pression, fragilité en torsion."}}),di({id:"e-05",titre:"Les MJ ont dit oui",categorie:"recherche",epoque:"avant",humeur:"excite",tags:["validation"],texte:`Le principe est accepté. Avec des conditions, et elles sont justes : connaître les matériaux avant, jouer réellement leur étude, des matrices longues au début, des résultats modestes, un suivi clair, et un nouveau dossier pour chaque application complexe.

Déroulement. Lecture : réussie. Décomposition : entamée. Pendant quelques secondes, un très grand nombre de connexions perçues en même temps. Puis la conscience s’est modifiée pendant que la matrice tentait de la recomposer. Recomposition : impossible à stabiliser. Retour de Résonance : total.

Point d’injection principal : bras gauche. Détruit. Amputé.

Prix : bras gauche.`,liens:["t:t-noese"],facettes:{...Qa(),reflexion:"J’ai voulu transformer mon esprit en bibliothèque. J’ai oublié qu’une bibliothèque ne souffre pas lorsque l’on déplace ses livres."}}),di({id:"e-07",titre:"Ce qui a changé",categorie:"vie",epoque:"apres",humeur:"methodique",tags:["personnel"],texte:`Inventaire, sans adjectifs.

name: Sauvegarde Supabase

on:
  schedule:
    - cron: '17 3 * * *'      # tous les jours à 03h17 UTC
  workflow_dispatch:          # et à la demande, bouton « Run workflow »

permissions:
  contents: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lire la base et écrire donnees/
        run: node tools/sauvegarde-supabase.mjs
      - name: Commettre si quelque chose a changé
        run: |
          git config user.name "sauvegarde-supabase"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/site.json donnees/archives.json
          git diff --cached --quiet && echo "Rien à commettre." || git commit -m "Sauvegarde des archives depuis Supabase" && git push

  Dépose tout le dossier tel quel. Les visiteurs voient les archives en lecture seule.

     à leur prochaine visite (ils relisent la base toutes les minutes). Plus de zip, plus de commit.

     1. Sur supabase.com : New project (région EU). Dans Settings → API Keys, note l'URL du projet
        (https://xxxx.supabase.co) et la clé « publishable » (sb_publishable_…). Cette clé est faite
        pour être dans un site public ; la clé sb_secret_ ne doit JAMAIS y être.
     2. Authentication → Users → Add user : ton e-mail + un mot de passe (coche « auto confirm »).
        Copie l'UUID de l'utilisateur. Puis Authentication → Sign In / Providers : décoche
        « Allow new users to sign up ».
     3. SQL Editor → colle et lance (remplace TON-UUID par l'UUID de l'étape 2) :

        create table public.archives (
          id text primary key,
          data jsonb not null,
          images jsonb not null default '{}',
          revision integer not null default 1,
          updated_at timestamptz not null default now()
        );
        insert into public.archives (id, data) values ('shinji', '{}');
        alter table public.archives enable row level security;
        create policy "lecture publique" on public.archives
          for select to anon, authenticated using (true);
        create policy "ecriture auteur" on public.archives
          for update to authenticated
          using (auth.uid() = 'TON-UUID') with check (auth.uid() = 'TON-UUID');

        (Si la table existait déjà sans la colonne images :
         alter table public.archives add column images jsonb not null default '{}';)

     4. Storage → New bucket : nom « images », coché Public. Puis dans le SQL Editor :

        create policy "images lecture" on storage.objects
          for select to anon, authenticated using (bucket_id = 'images');
        create policy "images auteur" on storage.objects
          for all to authenticated
          using (bucket_id = 'images' and auth.uid() = 'TON-UUID')
          with check (bucket_id = 'images' and auth.uid() = 'TON-UUID');

     5. Dans le dépôt : copie donnees/supabase.exemple.json en donnees/supabase.json et mets
        l'URL et la clé publishable dedans. C'est le seul commit nécessaire.
     6. Sur le site : Sauvegarde → « Se connecter » (e-mail + mot de passe de l'étape 2).
        La session reste dans ce navigateur ; sur un autre appareil, reconnecte-toi.

     Copie de secours : le workflow .github/workflows/sauvegarde-supabase.yml relit la base chaque nuit
     et met donnees/archives.json et donnees/site.json à jour dans le dépôt (bouton « Run workflow »
     dans l'onglet Actions pour le lancer à la main). Si la base ne répond pas (projet gratuit mis en
     pause après 7 jours sans activité : « Resume project » dans le tableau de bord), le site affiche
     cette copie, en lecture seule.

  signalée dans le site sans l'empêcher de s'ouvrir.
